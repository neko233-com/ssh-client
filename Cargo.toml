[package]
name = "ssh-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A cross-platform native Rust SSH terminal client"
license = "MIT"
repository = "https://github.com/neko233-com/ssh-client"
default-run = "ssh-client"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
tempfile = "3"
rand = "0.10"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
