name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ssh-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup target add '${{ matrix.target }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and real SSH integration tests
        run: cargo test --locked --all-targets
      - name: Provision independent OpenSSH fixture
        if: runner.os == 'Linux'
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          /usr/sbin/sshd -V
      - name: Installer and packaging tests
        env:
          SSH_CLIENT_REQUIRE_OPENSSH: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: PowerShell installer tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SSH_CLIENT_TEST_PERSISTENT_PATH: '1'
        run: ./tests/installers.Tests.ps1
      - name: Build release
        run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Package and verify binaries
        run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify all six packages and create manifest
        run: python3 scripts/package.py --manifest
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py --repository "${{ github.repository }}" --commit "${{ github.sha }}"
